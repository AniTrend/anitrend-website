approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmAuditIgnoreAdvisories:
  # fast-uri is constrained by ajv@8.20.0 to ^3.0.1. Remove when ajv accepts fast-uri 4.x.
  - "1124064"
  # sharp is constrained by next@16.2.11 to ^0.34.5. Remove when Next accepts sharp 0.35.x.
  - "1124066"
  # brace-expansion is constrained by minimatch@3.1.5 to ^1.1.7. Remove when legacy minimatch consumers move to a patched major range.
  - "1124334"
